<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra V</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="theme-toggle.js"></script>
    <link rel="shortcut icon" href="./src/img/favicon.webp" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Signature&display=swap" rel="stylesheet">
    <div id="header"></div>
</head>
<body>
    <header>
        <nav class="navbar" id="top">
            <div class="fullhomething">
                <a href="index.html">
                    <img class="home" src="./src/img/favicon.webp" alt="">
                    <img class="home-image-two" src="./src/img/kebabcrafttext.png" alt="Terra V">
                </a>
            </div>
            <ul class="nav-links">
                <li><button class="theme-toggle" onclick="toggleTheme()"><img src="./src/img/lightdarkicon.png" alt="Light/dark mode"></button></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./join.html">Join</a></li>
                <li><a href="./rules.html">Rules</a></li>
                <li><a href="./store.html">Store</a></li>
                <li><a href="./updates.html">Updates</a></li>
                <li><a href="./socials.html">Socials</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <canvas id="sky"></canvas>
            <div class="hero-content">
                <h1><img src="./src/img/kebabcrafttext.png" alt="Terra V"></h1>
                <h1>About Terra V.</h1>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
        <script src="./panorama.js"></script>

        <section>
            <p class="dev-cards">Terra V is a unique Earth Minecraft server where players can claim real-world locations, build cities, trade resources, and engage in politics and war!</p>
        </section>

        <section class="dev-team">
            <h2>Meet the Team</h2>
            <div id="team-container" class="dev-cards">
            </div>
        </section>

        <script>
        // Default-Skin
        const defaultSkin = "https://api.mineatar.io/body/full/aab62631839344588fee11c4414cee48?scale=16";
        let teamData;
        async function loadTeamData() {
            const response = await fetch("./src/db/people.json");
            teamData = await response.json();
            render();
        }
        loadTeamData();
        function render() {
            const container = document.getElementById('team-container');
            for (const [category, members] of Object.entries(teamData)) {
                const catDiv = document.createElement('div');
                const h2Class = category === 'Honorable Mentions' ? 'honorable-mentions' : '';
                catDiv.innerHTML = `<h2 class="${h2Class}">${category}</h2><ul></ul>`;
                const ul = catDiv.querySelector('ul');

                members.forEach(member => {
                    const li = document.createElement('li');
                    const skinUrl = member.skin || defaultSkin; 
                    li.innerHTML = `
                        <div class="dev-card">
                            <img class="skin" src="${skinUrl}" alt="${member.name}">
                            <h3>${member.name}</h3>
                            <p class="rank">${member.rank}</p>
                        </div>
                    `;
                    ul.appendChild(li);
                });

                container.appendChild(catDiv);
            }
        }
        </script>
    </main>

    <footer>
        <p>&copy; 2026 Terra V. All rights reserved.</p>
    </footer>
</body>
<script id="code"></script><script src="./src/lang/langControl.js"></script>
</html>
